<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --turf:#2F5138;
    --turf-dark:#213A28;
    --paper:#F6F3EA;
    --paper-line:#DFD8C4;
    --ink:#26261F;
    --ink-soft:#6B6656;
    --sand:#C79A4B;
    --miss:#B4463A;
    --good:#3C7A52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--turf-dark);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
  }
  header{
    background:var(--turf);
    color:var(--paper);
    padding:22px 20px 26px;
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:14px;
    background:var(--paper);
    border-radius:14px 14px 0 0;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.04em;
    color:var(--sand);
    margin:0 0 4px;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 14px;
  }
  .meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 10px;
  }
  .meta input{
    width:100%;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;
    padding:8px 10px;
    color:var(--paper);
    font-size:14px;
    font-family:inherit;
  }
  .meta input::placeholder{color:rgba(246,243,234,.55);}

  .gear-block{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .gear-label{
    font-size:12px;
    letter-spacing:.03em;
    color:rgba(246,243,234,.75);
    margin-bottom:8px;
  }
  .gear-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .gear-btns{
    display:flex;
    background:rgba(255,255,255,.1);
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
  }
  .gear-btns button{
    width:34px;
    height:34px;
    border:none;
    background:transparent;
    color:rgba(246,243,234,.7);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    border-right:1px solid rgba(255,255,255,.15);
  }
  .gear-btns button:last-child{border-right:none;}
  .gear-btns button.active{background:var(--sand);color:var(--turf-dark);}
  .gear-inputs{
    display:flex;
    gap:6px;
    flex:1;
  }
  .gear-inputs .g-field{flex:1;}
  .gear-inputs label{
    display:block;
    font-size:9.5px;
    color:rgba(246,243,234,.6);
    margin-bottom:3px;
  }
  .gear-inputs input{
    width:100%;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    padding:6px 6px;
    color:var(--paper);
    font-size:13px;
    text-align:center;
    font-family:inherit;
  }
  .gear-note{
    font-size:10.5px;
    color:rgba(246,243,234,.55);
    margin-top:7px;
    line-height:1.4;
  }

  .tabbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .tab-btn{
    flex:1;
    padding:13px 8px;
    border:none;
    background:transparent;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .tab-btn.active{
    color:var(--turf);
    border-bottom-color:var(--sand);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .history-wrap{
    margin:16px;
  }
  .history-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:40px 20px;
    line-height:1.5;
  }
  .hist-card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
  }
  .hist-card:active{background:#F3EFE3;}
  .hist-main .hist-course{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .hist-main .hist-date{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .hist-main .hist-stats{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:5px;
  }
  .hist-score{
    text-align:right;
    flex-shrink:0;
  }
  .hist-score .num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:var(--turf);
    line-height:1;
  }
  .hist-score .par{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .hist-del{
    background:none;
    border:none;
    color:var(--miss);
    font-size:16px;
    padding:4px 2px;
    cursor:pointer;
    flex-shrink:0;
  }

  .rr-section{
    margin:16px 16px 4px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:14px 16px 6px;
  }
  .rr-section h3{
    font-family:'Fraunces',serif;
    font-size:16px;
    margin:0 0 10px;
    color:var(--turf);
  }
  .rr-group-title{
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin:10px 0 4px;
  }
  .rr-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .rr-row:last-child{border-bottom:none;}
  .rr-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:var(--sand);
    min-width:26px;
    text-align:center;
    flex-shrink:0;
  }
  .rr-label{
    font-size:12.5px;
    color:var(--ink);
    line-height:1.35;
    flex:1;
  }

  .an-row{
    padding:11px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .an-row:last-child{border-bottom:none;}
  .an-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .an-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .an-badge{

<body>
<div class="wrap">

  <header>
    <p class="eyebrow">SCORING ZONE TRACKER</p>
    <h1>Round Card</h1>
    <div class="meta">
      <input id="name" placeholder="Name" />
      <input id="course" placeholder="Course" />
      <input id="date" type="date" placeholder="Date" />
      <input id="tee" placeholder="Tee" />
      <input id="handicap" inputmode="numeric" placeholder="Course Handicap" style="grid-column:1 / -1" />
    </div>
    <div class="gear-block">
      <div class="gear-label">GEAR (scoring zone target)</div>
      <div class="gear-row">
        <div class="gear-btns" id="gearBtns">
          <button data-gear="1">1</button>
          <button data-gear="2">2</button>
          <button data-gear="3">3</button>
          <button data-gear="4">4</button>
        </div>
        <div class="gear-inputs">
          <div class="g-field">
            <label>Within (yd)</label>
            <input id="gearDist" inputmode="numeric" />
          </div>
          <div class="g-field">
            <label>Down in</label>
            <input id="gearDownIn" inputmode="numeric" />
          </div>
        </div>
      </div>
      <div class="gear-note" id="gearNote"></div>
    </div>
  </header>

  <div class="tabbar">
    <button class="tab-btn" data-tab="keys">10 Keys to Scoring</button>
    <button class="tab-btn active" data-tab="round">Round Card</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>

  <div id="tab-round" class="tab-panel active">

    <div class="summary" id="summary"></div>

    <div class="legend">
      <span><span class="dot" style="background:var(--good)"></span>Success</span>
      <span><span class="dot" style="background:var(--miss)"></span>Miss</span>
      <span><span class="dot" style="background:var(--sand)"></span>Lost ball / penalty</span>
    </div>

    <div class="holes" id="holes"></div>

    <div class="rr-section" id="roundResults"></div>

    <div class="rr-section" id="analysisTable"></div>

    <div id="status"></div>
    <div class="actions">
      <button id="saveBtn">Save round</button>
      <button id="exportBtn">Export for analysis</button>

    <div class="trends-wrap" id="trendsWrap"></div>
    <div class="history-wrap" id="historyList"></div>
  </div>

</div>

<script>
const KEYS = [
  ["Missed short putts", "Make everything inside 4 feet — no exceptions."],
  ["Penalty strokes", "Play away from trouble first; chase the flag second."],
  ["Struggling to escape trouble", "Priority one is back in play, not the hero shot."],
  ["Three-putts", "Long putts live and die on pace, not a perfect line."],
  ["Under-clubbing", "When in doubt, take one more club and play for the long miss."],
  ["Risky shot selection", "Only hit shots you can repeat under pressure."],
  ["Short-siding yourself", "Favor the fat side of the green, not the flag."],
  ["Carrying a bad hole forward", "Reset fully before the next tee shot."],
  ["Misjudging the lie", "Match the shot to what the lie actually allows."],
  ["Slow starts", "Play conservative on the first few holes — ease in."]
];

// key indices are 0-based positions into KEYS (i.e. Key #1 = index 0)
const AREA_META = [
  { id:'teeShots',  name:'Tee Shots',       color:'#2F5138', keyIdx:[1] },
  { id:'approach',  name:'Approach Shots',  color:'#3C7A52', keyIdx:[4,8] },
  { id:'shortGame', name:'Short Game',      color:'#C79A4B', keyIdx:[2,6,8] },
  { id:'lagPutts',  name:'Lag Putts',       color:'#8A6A2F', keyIdx:[3] },
  { id:'shortPutts',name:'Short Putts',     color:'#B4463A', keyIdx:[0] },
  { id:'strategy',  name:'Course Strategy', color:'#6B6656', keyIdx:[1,5,7,9] }
];

function computeAreas(holes){
  holes = holes || [];

  const teeSeen = holes.filter(h=>h.teeShot!=='').length;
  const teeHit = holes.filter(h=>h.teeShot==='check').length;
  const teeShots = teeSeen ? Math.round(100*teeHit/teeSeen) : null;

  const approachAttempts = holes.filter(h => h.teeShot==='check' || parseInt(h.par)===3);
  const approachSeen = approachAttempts.filter(h=>h.esz!=='').length;
  const approachHit = approachAttempts.filter(h=>h.esz==='check').length;
  const approach = approachSeen ? Math.round(100*approachHit/approachSeen) : null;

  const szSeen = holes.filter(h=>h.sz!=='').length;
  const szHit = holes.filter(h=>h.sz==='check').length;
  const shortGame = szSeen ? Math.round(100*szHit/szSeen) : null;

  const puttHoles = holes.filter(h=>h.puttsTotal!=='');
  const threePutts = puttHoles.filter(h=>(parseInt(h.puttsTotal)||0)>=3).length;
  const lagPutts = puttHoles.length ? Math.round(100*(1-threePutts/puttHoles.length)) : null;

  const shortPuttAttempts = holes.filter(h=>h.shortPutt==='check'||h.shortPutt==='x');
  const shortPuttMakes = holes.filter(h=>h.shortPutt==='check').length;
  const shortPutts = shortPuttAttempts.length ? Math.round(100*shortPuttMakes/shortPuttAttempts.length) : null;

  const strategySeen = holes.filter(h=>h.esz!==''||h.sz!==''||h.teeShot!=='').length;
  const penaltyHoles = holes.filter(h=>h.esz==='o'||h.sz==='o'||h.teeShot==='o').length;
  const strategy = strategySeen ? Math.round(100*(1-penaltyHoles/strategySeen)) : null;

  return { teeShots, approach, shortGame, lagPutts, shortPutts, strategy };
}

function ratingFor(pct){
  if(pct === null) return {label:'No data', cls:'nodata'};
  if(pct >= 70) return {label:'Strength', cls:'strength'};
  if(pct >= 45) return {label:'On track', cls:'ontrack'};
  return {label:'Needs work', cls:'needswork'};
}

const holesEl = document.getElementById('holes');
const summaryEl = document.getElementById('summary');
const keysEl = document.getElementById('keysList');
const statusEl = document.getElementById('status');

function genId(){
  return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

let state = {
  id: genId(),
  name:'', course:'', date:'', tee:'', handicap:'',
  currentGear: 1,
  gearSettings: {
    1: { dist:100, downIn:3 },
    2: { dist:50, downIn:2 },
    3: { dist:25, downIn:2 },
    4: { dist:0, downIn:1 }
  },
  holes: Array.from({length:18}, (_,i)=>({
    n:i+1, par:'', esz:'', sz:'', putts4:'', puttsTotal:'', score:'', shotsEnter:'', shotsDownIn:'', shortPutt:'', teeShot:'', teeMiss:'', done:false, shots:[]
  }))
};

const GEAR_NOTES = {
  1: 'Gear 1 (documented): reach inside 100y in regulation, get down in 3.',
  2: 'Gear 2 (documented): reach inside 50y in regulation, get down in 2.',
  3: 'Gear 3: reach inside 25y in regulation, get down in 2.',
  4: 'Gear 4: reach the green in regulation, get down in 1 (one-putt).'
};

function zoneLabel(dist){
  const n = Number(dist);
  if(dist === '' || dist === null || dist === undefined) return '–';
  if(n === 0) return 'On green';
  return `<${dist}y`;
}

function renderGearControls(){
  document.querySelectorAll('#gearBtns button').forEach(b=>{
    b.classList.toggle('active', +b.dataset.gear === state.currentGear);
  });
  const g = state.gearSettings[state.currentGear];
  document.getElementById('gearDist').value = g.dist;
  document.getElementById('gearDownIn').value = g.downIn;
  document.getElementById('gearNote').textContent = GEAR_NOTES[state.currentGear];
}

document.querySelectorAll('#gearBtns button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.currentGear = +b.dataset.gear;
    renderGearControls();
    renderHoles();
    renderSummary();
      renderRoundResults();
      renderAnalysisTable();
    persist();
  });
});
document.getElementById('gearDist').addEventListener('input', e=>{
  state.gearSettings[state.currentGear].dist = e.target.value;
  renderHoles();
  persist();
});
document.getElementById('gearDownIn').addEventListener('input', e=>{
  state.gearSettings[state.currentGear].downIn = e.target.value;
  renderHoles();
  persist();
});

function renderKeys(){
  keysEl.innerHTML = KEYS.map((k,i)=>`
    <div class="key-row">
      <div class="key-num">${i+1}</div>
      <div>
        <div class="key-problem">${k[0]}</div>
        <div class="key-fix">${k[1]}</div>
      </div>
    </div>
  `).join('');
}

function toggleBtns(hole, field){
  const val = hole[field];
  return `
    <div class="toggle3" data-hole="${hole.n}" data-field="${field}">
      <button data-val="check" class="${val==='check'?'on-check':''}">✓</button>
      <button data-val="x" class="${val==='x'?'on-x':''}">✗</button>
      <button data-val="o" class="${val==='o'?'on-o':''}">O</button>
    </div>
  `;
}

function togglePuttBtns(hole){
  const val = hole.shortPutt;
  return `
    <div class="toggle3" data-hole="${hole.n}" data-field="shortPutt">
      <button data-val="check" class="${val==='check'?'on-check':''}">✓</button>
      <button data-val="x" class="${val==='x'?'on-x':''}">✗</button>
      <button data-val="plus" class="${val==='plus'?'on-plus':''}">+</button>
    </div>
  `;
}

const GS_TYPES  = [['fullwedge','Full W'],['pitch','Pitch'],['chip','Chip'],['sand','Sand']];
const PUTT_TYPES= [['lag','Lag'],['short','Short'],['tap',"<4'"],['gimme','Gimme']];
const isGreenside = t => t==='pitch' || t==='chip' || t==='sand' || t==='fullwedge';
const isPutt      = t => t==='lag' || t==='short' || t==='tap' || t==='gimme';

const CONN_GS   = [['good','✓','on-check'],['thin','Thin','on-x'],['fat','Fat','on-x']];
const CONN_PUTT = [['good','✓','on-check'],['heel','Heel','on-x'],['toe','Toe','on-x'],['open','Open','on-x'],['close','Close','on-x']];
const OUT_DIRS  = [['long','Long','on-x'],['short','Short','on-x'],['left','Left','on-x'],['right','Right','on-x']];
const OUT_GS    = [['good','✓ Close','on-check'], ...OUT_DIRS];
const OUT_LAG   = [['good','✓ Close','on-check'], ...OUT_DIRS];   // lag: finished stone dead (or holed)
const OUT_TAP   = [['good','✓ Holed','on-check'], ...OUT_DIRS];   // inside 4ft: it either goes in or it doesn't

// Resize a hole's shot list to shots-to-get-down; rows before the putt band are
// greenside shots, rows after are putts.
function ensureShots(hole){
  const n = parseInt(hole.shotsDownIn);
  if(!hole.shots) hole.shots = [];
  if(isNaN(n) || n <= 0) return hole.shots;

  while(hole.shots.length < n) hole.shots.push({type:'',surface:'',texture:'',conn:'',out:''});
  if(hole.shots.length > n) hole.shots.length = n;

  // migrate older rounds where thin/fat lived in `out`
  hole.shots.forEach(s => {
    if(s.conn === undefined) s.conn = '';
    if((s.out==='thin'||s.out==='fat') && !s.conn){ s.conn = s.out; s.out=''; }
  });

  const putts = parseInt(hole.puttsTotal);
  if(!isNaN(putts)){
    const gsCount = Math.max(0, n - putts);
    hole.shots.forEach((s,i) => {
      if(s.type) return;
      if(i >= gsCount){
        const puttIdx = i - gsCount, puttsLeft = n - gsCount;
        s.type = (puttsLeft > 1 && puttIdx === 0) ? 'lag' : 'tap';
      }
    });
  }
  return hole.shots;
}

function greensideBand(hole){
  const n = parseInt(hole.shotsDownIn), putts = parseInt(hole.puttsTotal);
  if(isNaN(n)) return 99;
  return isNaN(putts) ? n : Math.max(0, n - putts);
}

// Keep the official-card putt marker consistent with the detailed shot log.
function syncFromShots(hole){
  const shots = (hole.shots||[]).filter(s => s.type);
  if(!shots.length) return;
  const taps = shots.filter(s => s.type === 'tap' && s.out);
  if(taps.length){
    hole.shortPutt = taps.some(s => s.out !== 'good') ? 'x' : 'check';
  } else if(shots.some(s => s.type === 'gimme')){
    hole.shortPutt = 'check';
  }
  // a long putt only counts as made if it was the last shot played on the hole
  const last = shots[shots.length-1];
  if(last && (last.type==='lag'||last.type==='short') && last.out === 'good') hole.shortPutt = 'plus';
}

function shotToggle(holeN, idx, key, opts, val, extraClass){
  return `
    <div class="toggle3 shot-toggle ${extraClass||''}" data-hole="${holeN}" data-idx="${idx}" data-key="${key}">
      ${opts.map(o=>`<button data-val="${o[0]}" class="${val===o[0]?(o[2]||'on-lie'):''}">${o[1]}</button>`).join('')}
    </div>
  `;
}

function shotRow(hole, s, i, band){
  const n = hole.n;
  const inPuttBand = i >= band;
  const typeOpts = inPuttBand ? PUTT_TYPES : GS_TYPES;
  const typeRow = shotToggle(n, i, 'type', typeOpts, s.type, 'type-toggle');

  let detail = '';
  if(isGreenside(s.type)){
    detail = `
      <div class="shot-detail">
        ${shotToggle(n,i,'surface',[['fairway','Fwy'],['rough','Rough'],['sand','Sand']], s.surface)}
        ${shotToggle(n,i,'texture',[['fluffy','Fluffy'],['tight','Tight']], s.texture)}
        <div class="shot-sub">CONNECTION</div>
        ${shotToggle(n,i,'conn',CONN_GS, s.conn)}
        <div class="shot-sub">OUTCOME</div>
        ${shotToggle(n,i,'out',OUT_GS, s.out)}
      </div>`;
  } else if(s.type === 'gimme'){
    detail = `<div class="shot-sub" style="margin-top:5px">Conceded — no stroke tested, excluded from make%.</div>`;
  } else if(isPutt(s.type)){
    detail = `
      <div class="shot-detail">
        <div class="shot-sub">CONNECTION</div>
        ${shotToggle(n,i,'conn',CONN_PUTT, s.conn)}
        <div class="shot-sub">OUTCOME</div>
        ${shotToggle(n,i,'out', s.type==='tap' ? OUT_TAP : OUT_LAG, s.out)}
      </div>`;
  }

  return `
    <div class="shot-row">
      <div class="shot-idx">${i+1}</div>
      <div class="shot-body">${typeRow}${detail}</div>
    </div>
  `;
}

function shotTable(hole){
  const shots = ensureShots(hole);
  if(!shots.length){
    return `<div class="shot-empty">Enter shots taken for “Down in ${(state.gearSettings[state.currentGear]||{}).downIn ?? '3'}” above to log each shot.</div>`;
  }
  const band = greensideBand(hole);
  return `<div class="shot-table">${shots.map((s,i)=>shotRow(hole,s,i,band)).join('')}</div>`;
}

function compactHole(h){
  const m = v => v==='check' ? '<span class="cm ok">✓</span>'
              : v==='x'     ? '<span class="cm bad">✗</span>'
              : v==='o'     ? '<span class="cm pen">O</span>' : '<span class="cm nil">–</span>';
  const par = h.par || '–';
  const sc  = h.score || '–';
  const rel = (h.par && h.score) ? (parseInt(h.score)-parseInt(h.par)) : null;
  const relStr = rel===null ? '' : rel===0 ? 'E' : rel>0 ? '+'+rel : String(rel);
  const relCls = rel===null ? '' : rel<=0 ? 'ok' : rel===1 ? 'warn' : 'bad';
  return `
    <div class="hole-card done" data-hole="${h.n}" data-action="expand">
      <div class="compact">
        <div class="c-num">${h.n}</div>
        <div class="c-par">par ${par}</div>
        <div class="c-score ${relCls}">${sc}${relStr?` <small>${relStr}</small>`:''}</div>
        <div class="c-marks">T${m(h.teeShot)} Z${m(h.esz)} D${m(h.sz)}</div>
        <div class="c-putts">${h.puttsTotal||'–'} putts</div>
        <div class="c-chev">›</div>
      </div>
    </div>`;
}

function renderHoles(){
  const g = state.gearSettings[state.currentGear] || {dist:'', downIn:''};
  const dist = zoneLabel(g.dist);
  const downIn = g.downIn !== '' && g.downIn != null ? g.downIn : '–';

  const anyOpen = state.holes.some(h => !h.done);
  holesEl.innerHTML = `
    <div class="holes-bar">
      <button id="toggleAllBtn" data-open="${anyOpen?1:0}">${anyOpen ? 'Collapse all' : 'Expand all'}</button>
    </div>
  ` + state.holes.map(h => h.done ? compactHole(h) : `
    <div class="hole-card">
      <div class="hole-top">
        <div class="hole-id">
          <span class="n">Hole ${h.n}</span>
          <input class="par-input" inputmode="numeric" placeholder="Par" value="${h.par}" data-hole="${h.n}" data-field="par" />
        </div>
        <div style="text-align:right;display:flex;align-items:flex-end;gap:8px">
          <button class="done-btn" data-hole="${h.n}" data-action="done">Done ✓</button>
          <div>
            <div class="field-label" style="text-align:right">SCORE</div>
            <input class="score-input" inputmode="numeric" placeholder="–" value="${h.score}" data-hole="${h.n}" data-field="score" />
          </div>
        </div>
      </div>
      <div class="row" style="grid-template-columns:1fr">
        <div>
          <div class="field-label">TEE SHOT — ✓ fairway / ✗ miss / O penalty</div>
          ${toggleBtns(h,'teeShot')}
          ${(h.teeShot==='x'||h.teeShot==='o') ? `
            <div class="shot-sub" style="margin-top:6px">MISS TYPE</div>
            <div class="toggle3" data-hole="${h.n}" data-field="teeMiss">
              ${[['slice','Slice'],['hook','Hook'],['thin','Thin'],['fat','Fat']].map(o=>
                `<button data-val="${o[0]}" class="${h.teeMiss===o[0]?'on-x':''}">${o[1]}</button>`).join('')}
            </div>` : ''}
        </div>
      </div>
      <div class="row">
        <div>
          <div class="field-label">ENTER ZONE — ${dist}</div>
          ${toggleBtns(h,'esz')}
          <input class="shots-input" inputmode="numeric" placeholder="Shots taken" value="${h.shotsEnter}" data-hole="${h.n}" data-field="shotsEnter" />
          <div class="shots-cap">Target: ${h.par ? Math.max(1, (parseInt(h.par)||0) - 2) : '–'} shot${h.par && Math.max(1,(parseInt(h.par)||0)-2)===1?'':'s'}${h.par ? '' : ' (enter par)'}</div>
        </div>
        <div>
          <div class="field-label">DOWN IN ${downIn}</div>
          ${toggleBtns(h,'sz')}
          <input class="shots-input" inputmode="numeric" placeholder="Shots taken" value="${h.shotsDownIn}" data-hole="${h.n}" data-field="shotsDownIn" />
          <div class="shots-cap">Target: ${downIn}</div>
        </div>
      </div>
      <div class="putts-row">
        <div>
          <div class="field-label">PUTT &lt;4FT (✓ made / ✗ miss / + long make)</div>
          ${togglePuttBtns(h)}
        </div>
        <div>
          <div class="field-label">TOTAL PUTTS</div>
          <input class="num-input" inputmode="numeric" value="${h.puttsTotal}" data-hole="${h.n}" data-field="puttsTotal" />
        </div>
      </div>
      <div class="row" style="grid-template-columns:1fr">
        <div>
          <div class="field-label">SHOT-BY-SHOT — from scoring zone to holed</div>
          ${shotTable(h)}
        </div>
      </div>
    </div>
  `).join('');

  const rerender = () => { renderHoles(); renderSummary(); renderRoundResults(); renderAnalysisTable(); persist(); };

  const allBtn = holesEl.querySelector('#toggleAllBtn');
  if(allBtn){
    allBtn.addEventListener('click', ()=>{
      const collapsing = allBtn.dataset.open === '1';
      state.holes.forEach(h => { h.done = collapsing; });
      rerender();
    });
  }

  holesEl.querySelectorAll('[data-action="done"]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const h = state.holes.find(x=>x.n === +b.dataset.hole);
      h.done = true;
      rerender();
    });
  });

  holesEl.querySelectorAll('[data-action="expand"]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const h = state.holes.find(x=>x.n === +card.dataset.hole);
      h.done = false;
      rerender();
    });
  });

  holesEl.querySelectorAll('.toggle3').forEach(t=>{
    t.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        const holeN = +t.dataset.hole;
        const hole = state.holes.find(h=>h.n===holeN);

        if(t.classList.contains('shot-toggle')){
          const idx = +t.dataset.idx;
          const key = t.dataset.key;
          ensureShots(hole);
          const shot = hole.shots[idx];
          if(shot){
            const newVal = shot[key] === b.dataset.val ? '' : b.dataset.val;
            shot[key] = newVal;
            if(key === 'type'){ shot.surface=''; shot.texture=''; shot.out=''; }
          }
          syncFromShots(hole);
        } else {
          const field = t.dataset.field;
          hole[field] = hole[field] === b.dataset.val ? '' : b.dataset.val;
        }

        renderHoles();
        renderSummary();
        renderRoundResults();
        renderAnalysisTable();
        persist();
      });
    });
  });

  holesEl.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const holeN = +inp.dataset.hole;
      const field = inp.dataset.field;
      const hole = state.holes.find(h=>h.n===holeN);
      hole[field] = inp.value;

      if(field === 'shotsEnter' || field === 'par'){
        autoGrade(hole, 'esz', 'shotsEnter', hole.par ? Math.max(1, (parseInt(hole.par)||0) - 2) : null);
      }
      if(field === 'shotsDownIn'){
        const g = state.gearSettings[state.currentGear];
        autoGrade(hole, 'sz', 'shotsDownIn', g && g.downIn !== '' ? parseInt(g.downIn) : null);
      }
      if(field === 'shotsEnter' || field === 'shotsDownIn'){
        const enter = parseInt(hole.shotsEnter);
        const downIn = parseInt(hole.shotsDownIn);
        if(!isNaN(enter) && !isNaN(downIn)){
          hole.score = String(enter + downIn);
        }
      }
      if(field === 'shotsDownIn' || field === 'puttsTotal'){
        ensureShots(hole);
      }
      renderHoles();
      renderSummary();
      renderRoundResults();
      renderAnalysisTable();
      persist();

      const refocus = holesEl.querySelector(`input[data-hole="${holeN}"][data-field="${field}"]`);
      if(refocus){
        refocus.focus();
        const v = refocus.value;
        try{ refocus.setSelectionRange(v.length, v.length); }catch(e){}
      }
    });
  });
}

function autoGrade(hole, field, shotsField, target){
  if(hole[field] === 'o') return; // manual penalty flag takes priority, don't overwrite
  const shots = parseInt(hole[shotsField]);
  if(isNaN(shots) || target === null || isNaN(target)) return;
  hole[field] = shots <= target ? 'check' : 'x';
}

function renderSummary(){
  const holes = state.holes;
  const g = state.gearSettings[state.currentGear] || {dist:'', downIn:''};
  const dist = zoneLabel(g.dist);
  const downIn = g.downIn !== '' && g.downIn != null ? g.downIn : '–';
  const played = holes.filter(h=>h.score!=='').length || holes.filter(h=>h.esz||h.sz||h.puttsTotal).length;
  const eszHit = holes.filter(h=>h.esz==='check').length;
  const eszSeen = holes.filter(h=>h.esz!=='').length;
  const szHit = holes.filter(h=>h.sz==='check').length;
  const szSeen = holes.filter(h=>h.sz!=='').length;
  const totalPutts = holes.reduce((s,h)=> s + (parseInt(h.puttsTotal)||0), 0);
  const penalties = holes.filter(h=> h.esz==='o' || h.sz==='o').length;

  const eszPct = eszSeen ? Math.round(100*eszHit/eszSeen) : 0;
  const szPct = szSeen ? Math.round(100*szHit/szSeen) : 0;
  const totalScore = holes.reduce((s,h)=> s + (parseInt(h.score)||0), 0);
  const holesWithScore = holes.filter(h=>h.score!=='').length;
  // only count par for holes actually scored, else a partial round shows a nonsense to-par
  const totalPar = holes.reduce((s,h)=> s + (parseInt(h.score)!==undefined && h.score!=='' ? (parseInt(h.par)||0) : 0), 0);
  const toPar = totalPar ? (totalScore - totalPar) : null;
  const toParStr = toPar===null ? '' : (toPar>0?`+${toPar}`:toPar===0?'E':`${toPar}`);
  const hcp = parseInt(state.handicap);
  const netStr = (holesWithScore >= 18 && !isNaN(hcp)) ? ` &middot; Net ${totalScore - hcp}` : '';

  summaryEl.className = 'summary five';
  summaryEl.innerHTML = `
    <div class="stat hero"><div class="num">${holesWithScore ? totalScore : '–'}</div><div class="lbl">Total score${toParStr?` (${toParStr})`:''}${netStr}</div></div>
    <div class="stat"><div class="num">${eszPct}%</div><div class="lbl">${dist} rate</div></div>
    <div class="stat"><div class="num">${szPct}%</div><div class="lbl">Down in ${downIn}</div></div>
    <div class="stat"><div class="num">${totalPutts||'–'}</div><div class="lbl">Total putts</div></div>
    <div class="stat"><div class="num">${penalties}</div><div class="lbl">Lost ball / penalty</div></div>
  `;
}

function renderRoundResults(){
  const holes = state.holes;
  const holesWithScore = holes.filter(h=>h.score!=='').length;
  const eszSeen = holes.filter(h=>h.esz!=='').length;
  const playedCount = holesWithScore || eszSeen;

  const box1 = holes.filter(h=>h.esz==='check').length;
  const box2 = holes.filter(h=>h.sz==='check').length;
  const box3plus = holes.filter(h=>h.shortPutt==='plus').length;
  const box3x = holes.filter(h=>h.shortPutt==='x').length;
  const box4 = holes.filter(h=>parseInt(h.puttsTotal)===1).length;
  const threePlusInPos = holes.filter(h=> (parseInt(h.puttsTotal)||0) >= 3 && h.esz==='check').length;

  const feedbackA = Math.max(0, playedCount - box1);
  const feedbackB = Math.max(0, playedCount - box2);

  const el = document.getElementById('roundResults');
  el.innerHTML = `
    <h3>Round Results</h3>
    <div class="rr-group-title">SUCCESSES</div>
    <div class="rr-row"><div class="rr-num">${box1}</div><div class="rr-label">Times I gave myself a chance to score</div></div>
    <div class="rr-row"><div class="rr-num">${box2}</div><div class="rr-label">Times I scored when in position</div></div>
    <div class="rr-row"><div class="rr-num">${box3plus}</div><div class="rr-label">Strokes gained putting (long putts made)</div></div>
    <div class="rr-row"><div class="rr-num">${box4}</div><div class="rr-label">One-putts</div></div>
    <div class="rr-group-title">FEEDBACK</div>
    <div class="rr-row"><div class="rr-num">${feedbackA}</div><div class="rr-label">Times I was out of position to score</div></div>
    <div class="rr-row"><div class="rr-num">${feedbackB}</div><div class="rr-label">Times I did not score when in position</div></div>
    <div class="rr-row"><div class="rr-num">${box3x}</div><div class="rr-label">Putts missed inside 4ft</div></div>
    <div class="rr-row"><div class="rr-num">${threePlusInPos}</div><div class="rr-label">3+ putts when in position</div></div>
  `;
}

function diagnose(holes, gearDownIn){
  const H = holes.filter(h => h.score!=='' || h.esz!=='' || h.puttsTotal!=='' || h.shotsDownIn!=='');
  const f = [];              // findings
  const lost = { lag:0, shortPutt:0, shortGame:0, tee:0, approach:0, penalty:0 };
  const hn = arr => arr.map(h=>h.n).join(', ');

  const num = v => { const n = parseInt(v); return isNaN(n) ? null : n; };
  const greenside = h => {
    const sd = num(h.shotsDownIn), p = num(h.puttsTotal);
    return (sd!==null && p!==null) ? Math.max(0, sd - p) : null;
  };

  // ---------- PUTTING ----------
  const threePutts = H.filter(h => (num(h.puttsTotal)||0) >= 3);
  const lagOnly    = threePutts.filter(h => h.shortPutt === 'check');
  const compounded = threePutts.filter(h => h.shortPutt === 'x');
  const shortMiss  = H.filter(h => h.shortPutt === 'x');

  threePutts.forEach(h => {
    const extra = (num(h.puttsTotal)||0) - 2;
    const shortPart = h.shortPutt === 'x' ? 1 : 0;
    lost.lag += Math.max(0, extra - shortPart);
  });
  lost.shortPutt += shortMiss.length;

  if(lagOnly.length){
    f.push({
      sev: lagOnly.length >= 3 ? 'crit' : 'warn',
      title: `${lagOnly.length} three-putt${lagOnly.length>1?'s':''} caused by the FIRST putt`,
      body: `Hole${lagOnly.length>1?'s':''} ${hn(lagOnly)}. You holed the short one each time, so the stroke was lost on the lag — you left yourself outside gimme range. This is pure speed control, not read.`,
      fix: `Ladder drill: 20/30/40/50ft, ignore the hole, just stop the ball inside a 3ft circle. 10 balls each distance.`
    });
  }
  if(compounded.length){
    f.push({
      sev: 'crit',
      title: `${compounded.length} three-putt${compounded.length>1?'s':''} where you ALSO missed the short one`,
      body: `Hole${compounded.length>1?'s':''} ${hn(compounded)}. Two failures stacked on one green — bad lag left a testing putt, then the short putt went too. These are the most expensive holes on the card.`,
      fix: `Fix the short putt first, it's the cheaper win. Gate drill inside 4ft until you can make 25 in a row.`
    });
  }
  if(shortMiss.length >= 2){
    f.push({
      sev: 'crit',
      title: `${shortMiss.length} misses from inside 4ft`,
      body: `Hole${shortMiss.length>1?'s':''} ${hn(shortMiss)}. These are ${shortMiss.length} strokes handed away with a putter from tap-in range. Key 1 says make everything inside 4ft — no exceptions.`,
      fix: `Circle drill: 8 balls at 3ft around the hole, must make all 8 before you leave. Repeat 3 rounds.`
    });
  }

  // ---------- SHORT GAME (derived: shots to get down minus putts) ----------
  const sgHoles = H.filter(h => greenside(h) !== null);
  const sgFails = sgHoles.filter(h => greenside(h) >= 2);
  sgFails.forEach(h => { lost.shortGame += greenside(h) - 1; });

  if(sgFails.length){
    const lieCount = {};
    sgFails.forEach(h => {
      (h.shots||[]).forEach(sh => {
        if(sh.type==='pitch'||sh.type==='chip'||sh.type==='sand'){
          const l = [sh.surface, sh.texture].filter(Boolean).join(' ');
          if(l) lieCount[l] = (lieCount[l]||0)+1;
        }
      });
    });
    const lieStr = Object.keys(lieCount).length
      ? ` Lies: ${Object.entries(lieCount).map(([k,v])=>`${v}\u00d7 ${k}`).join(', ')}.`
      : ` (Tag surface and texture on those holes to pin the cause down.)`;
    f.push({
      sev: sgFails.length >= 3 ? 'crit' : 'warn',
      title: `${sgFails.length} hole${sgFails.length>1?'s':''} needed 2+ shots to reach the green from the scoring zone`,
      body: `Hole${sgFails.length>1?'s':''} ${hn(sgFails)}. Working back from shots-to-get-down minus putts, you played more than one greenside shot.${lieStr} This is where the Down-In target actually broke.`,
      fix: `One-club, three-distance wedge drill: same club, land it on 3 separate targets 10/20/30y. 15 balls per target.`
    });
  }

  // ---------- SHOT-LEVEL SHORT GAME & PUTTING ----------
  const allShots = [];
  H.forEach(h => (h.shots||[]).forEach(sh => { if(sh.type) allShots.push({...sh, hole:h.n}); }));

  const gsAll   = allShots.filter(s => isGreenside(s.type));
  const turfGs  = gsAll.filter(s => s.type!=='sand');
  const sandGs  = gsAll.filter(s => s.type==='sand');
  const wedgeGs = gsAll.filter(s => s.type==='fullwedge');
  const puttAll = allShots.filter(s => isPutt(s.type));
  const lagShots = puttAll.filter(s => s.type==='lag' || s.type==='short');
  const tapShots = puttAll.filter(s => s.type==='tap');
  const gimmeShots = puttAll.filter(s => s.type==='gimme');

  const lbl = s => [s.surface,s.texture].filter(Boolean).join(' ');
  const tally = (arr, fn) => arr.reduce((m,x)=>{ const k=fn(x); if(k){m[k]=(m[k]||0)+1;} return m; },{});
  const tstr = t => Object.entries(t).map(([k,v])=>`${v}\u00d7 ${k}`).join(', ');
  const topKey = t => Object.entries(t).sort((a,b)=>b[1]-a[1])[0];

  // --- LAG / MID PUTT PACE & LINE ---
  const lagGraded = lagShots.filter(s=>s.out);
  if(lagGraded.length){
    const holed = lagGraded.filter(s=>s.out==='good');
    const miss  = lagGraded.filter(s=>s.out!=='good');
    const dir = tally(miss, s=>s.out);
    const sh=dir.short||0, lo=dir.long||0, le=dir.left||0, ri=dir.right||0;
    if(miss.length){
      let read, drill;
      if(sh >= lo + le + ri){
        read = `${sh} of ${lagGraded.length} lag putts finished SHORT. That is a systematic pace bias, not random error \u2014 you are under-hitting and never giving the ball a chance, then facing a testing second putt every time.`;
        drill = `Past-the-hole drill: lag from 30-40ft, the ball MUST finish past the hole. 20 balls. Accept 3ft long, never short.`;
      } else if(lo >= sh + le + ri){
        read = `${lo} of ${lagGraded.length} lag putts ran LONG, leaving downhill comebacks \u2014 which is exactly how short putts then get missed.`;
        drill = `Back-stop drill: tee 3ft behind the hole, ball must finish between hole and tee. 20 balls from 30-40ft.`;
      } else if(le + ri > sh + lo){
        read = `Your lag misses are mostly sideways (${le} left, ${ri} right) rather than long or short \u2014 pace is broadly fine, it is start line or read that is costing you.`;
        drill = `Gate drill at distance: two tees 18in ahead of the ball, roll 30ft putts through the gate. Line first, then pace.`;
      } else {
        read = `Lag misses are scattered (${tstr(dir)}) with no single bias \u2014 that points to inconsistent strike rather than one correctable habit.`;
        drill = `Centre-strike check: two tees just wider than the putter head, 30 balls from 25ft, focus only on middle contact.`;
      }
      const conn = tally(lagGraded.filter(s=>s.conn&&s.conn!=='good'), s=>s.conn);
      const connNote = Object.keys(conn).length ? ` Strike on those putts: ${tstr(conn)} \u2014 off-centre contact kills pace before line ever matters.` : '';
      f.push({
        sev: miss.length >= 3 ? 'crit' : 'warn',
        title: `Lag putting: ${miss.length} of ${lagGraded.length} left outside tap-in range`,
        body: `${read}${connNote}`,
        fix: drill
      });
    } else {
      f.push({ sev:'good', title:`Lag putting solid (${holed.length ? holed.length+' holed, ' : ''}${lagGraded.length} tracked)`, body:`Speed control gave you tap-ins.`, fix:null });
    }
  }

  // --- SHORT PUTTS <4ft ---
  const tapGraded = tapShots.filter(s=>s.out);
  if(tapGraded.length){
    const made = tapGraded.filter(s=>s.out==='good');
    const missed = tapGraded.filter(s=>s.out!=='good');
    if(missed.length){
      const dir = tally(missed, s=>s.out);
      const conn = tally(missed.filter(s=>s.conn&&s.conn!=='good'), s=>s.conn);
      const sh=dir.short||0, le=dir.left||0, ri=dir.right||0;
      let read, drill;
      const cTop = topKey(conn);
      if(cTop && (cTop[0]==='open'||cTop[0]==='close')){
        read = `Face control is the cause \u2014 ${tstr(conn)}. Inside 4ft the face at impact accounts for almost all of the start line, so this is a face problem, not a read problem.`;
        drill = `Face-square drill: 25 putts from 3ft, hold the finish and check the face is square to target on every one.`;
      } else if(cTop && (cTop[0]==='heel'||cTop[0]==='toe')){
        read = `Off-centre strike is the cause \u2014 ${tstr(conn)}. Heel and toe contact twists the face at impact and deadens the roll.`;
        drill = `Tee gate: two tees barely wider than the putter head, 25 putts from 3ft without touching either.`;
      } else if(sh >= le + ri){
        read = `Misses are coming up SHORT \u2014 decelerating through impact. Inside 4ft the ball must be firm enough to hold its line.`;
        drill = `Back-of-cup drill: from 3ft, every putt must reach the back of the cup. 25 in a row.`;
      } else if(le > ri){
        read = `Misses bias LEFT \u2014 typically a pull, shoulders turning through or the face closing.`;
        drill = `Gate drill: two tees a putter-head width apart 6in ahead. 25 from 3ft clean.`;
      } else if(ri > le){
        read = `Misses bias RIGHT \u2014 usually the face left open, often from a decelerating or handsy stroke.`;
        drill = `Gate drill plus face check: 25 from 3ft, confirm square face at the finish.`;
      } else {
        read = `Misses are scattered in direction \u2014 strike quality rather than a repeating aim or path fault.`;
        drill = `Coin drill: coin under the ball's equator, roll it without hopping. 20 reps from 3ft.`;
      }
      f.push({
        sev: missed.length >= 2 ? 'crit' : 'warn',
        title: `${missed.length} missed from inside 4ft (${made.length}/${tapGraded.length} made)`,
        body: `Miss pattern: ${tstr(dir)}. ${read} Key 1 \u2014 the cheapest strokes on the card to win back.${gimmeShots.length ? ` (${gimmeShots.length} gimme${gimmeShots.length>1?'s':''} excluded \u2014 your real make% under tournament rules would be tested more than this.)` : ''}`,
        fix: drill
      });
    } else if(made.length >= 3){
      f.push({ sev:'good', title:`Short putting perfect (${made.length}/${made.length} inside 4ft)`,
        body:`Nothing lost from tap-in range.${gimmeShots.length ? ` Note: ${gimmeShots.length} further putt${gimmeShots.length>1?'s were':' was'} conceded, so this is not a full test.` : ''}`, fix:null });
    }
  }

  if(gimmeShots.length >= 4 && !tapShots.filter(s=>s.out).length){
    f.push({
      sev:'warn',
      title:`${gimmeShots.length} putts conceded, none actually holed out`,
      body:`Gimmes hide the exact skill that Key 1 targets. If short putting is a known weakness, conceding them means you never find out where you stand \u2014 and it will show up the moment you play a medal or a match that is putted out.`,
      fix:`Putt everything out for a few rounds, even inside 3ft. You need the honest number before you can fix it.`
    });
  }

  // --- GREENSIDE TURF: connection then outcome ---
  const turfConn = turfGs.filter(s=>s.conn);
  const thin = turfConn.filter(s=>s.conn==='thin');
  const fat  = turfConn.filter(s=>s.conn==='fat');
  if(thin.length || fat.length){
    const dominant = thin.length > fat.length ? 'thin' : fat.length > thin.length ? 'fat' : 'mixed';
    let read, drill;
    if(dominant==='thin'){
      read = `Catching it THIN. The low point is drifting back \u2014 hanging on the trail foot or trying to help the ball up.`;
      drill = `Towel drill: towel 6in behind the ball, brush turf in FRONT of it. 20 balls, weight forward.`;
    } else if(dominant==='fat'){
      read = `Catching it FAT. Ground before ball means the low point sits behind where it should \u2014 weight stuck back or over-steepening.`;
      drill = `Line drill: divots must START on the line, never behind. 20 reps before hitting balls.`;
    } else {
      read = `An even thin/fat split means the low point is wandering rather than consistently misplaced \u2014 a contact-consistency problem, not one fault.`;
      drill = `Line drill for low-point control: divot starts on the line every time.`;
    }
    const lieT = tally([...thin,...fat], lbl);
    const tightBad = [...thin,...fat].filter(s=>s.texture==='tight').length;
    const fluffyBad = [...thin,...fat].filter(s=>s.texture==='fluffy').length;
    let texNote = '';
    if(tightBad >= 2 && tightBad > fluffyBad) texNote = ` Clustered on TIGHT lies \u2014 no cushion under the ball, so any low point behind it hits ground first.`;
    else if(fluffyBad >= 2 && fluffyBad > tightBad) texNote = ` Clustered on FLUFFY lies \u2014 the club slides under and deadens the strike. Use loft, do not dig.`;
    f.push({
      sev: (thin.length+fat.length) >= 3 ? 'crit' : 'warn',
      title: `${thin.length+fat.length} mis-struck chip/pitch \u2014 ${thin.length} thin, ${fat.length} fat`,
      body: `${read}${tstr(lieT) ? ' Lies: ' + tstr(lieT) + '.' : ''}${texNote}`,
      fix: drill
    });
  } else if(turfConn.length >= 3){
    const outMiss = turfGs.filter(s=>s.out && s.out!=='good');
    if(outMiss.length >= 2){
      const d2 = tally(outMiss, s=>s.out);
      f.push({
        sev:'warn',
        title:`Clean chip/pitch strike but ${outMiss.length} finished off target`,
        body:`Contact was fine, so this is not technique \u2014 it is landing spot and distance choice. Miss pattern: ${tstr(d2)}.`,
        fix:`Landing-spot drill: pick a towel as the landing target, not the hole. 15 balls, score on where it LANDS.`
      });
    } else {
      f.push({ sev:'good', title:`Chipping/pitching strike clean (${turfConn.length} shots)`, body:`Contact held up around the green.`, fix:null });
    }
  }

  // --- FULL WEDGE: a distance-control skill, not a touch skill ---
  const wedgeGraded = wedgeGs.filter(s=>s.out);
  if(wedgeGraded.length){
    const bad = wedgeGraded.filter(s=>s.out!=='good');
    if(bad.length){
      const d3 = tally(bad, s=>s.out);
      const sh=d3.short||0, lo=d3.long||0;
      let read, drill;
      if(sh >= lo + (d3.left||0) + (d3.right||0)){
        read = `Full wedges are finishing SHORT \u2014 the classic amateur pattern. You are almost certainly clubbing off your best-ever number rather than your average carry (Key 5, under-clubbing).`;
        drill = `Carry ladder: hit 10 balls each at 40/60/80y and record AVERAGE carry, not best. Club to the average from now on.`;
      } else if(lo > sh){
        read = `Full wedges are running LONG \u2014 over-swinging on partial shots rather than controlling length of backswing.`;
        drill = `Clock drill: 9 o'clock / 10 o'clock / 11 o'clock backswings with one wedge, 10 balls each, log the carry for each position.`;
      } else {
        read = `Full wedge misses are directional (${tstr(d3)}) rather than distance \u2014 alignment or face control on a full swing.`;
        drill = `Alignment stick drill: stick on the ground at target, 15 wedges, check start line every ball.`;
      }
      const conn3 = tally(bad.filter(s=>s.conn&&s.conn!=='good'), s=>s.conn);
      f.push({
        sev: bad.length >= 3 ? 'crit' : 'warn',
        title: `${bad.length} of ${wedgeGraded.length} full wedges missed the target`,
        body: `${read}${Object.keys(conn3).length ? ' Strike: ' + tstr(conn3) + '.' : ''}`,
        fix: drill
      });
    } else {
      f.push({ sev:'good', title:`Full wedge play sharp (${wedgeGraded.length} shots)`, body:`Distance control into the green held up.`, fix:null });
    }
  }

  // --- SAND on its own terms ---
  if(sandGs.length){
    const sGraded = sandGs.filter(s=>s.conn||s.out);
    const sBad = sGraded.filter(s=>(s.conn&&s.conn!=='good')||(s.out&&s.out!=='good'));
    if(sBad.length){
      const tight = sBad.filter(s=>s.texture==='tight').length;
      const fluffy = sBad.filter(s=>s.texture==='fluffy').length;
      let note='', drill=`Line-in-the-sand drill: draw a line, enter the sand on it every time with an open face.`;
      if(tight > fluffy && tight){
        note = ` These were FIRM/TIGHT sand \u2014 no cushion for a normal splash, so the bounce skids and the leading edge catches the ball thin.`;
        drill = `Firm-sand technique: square the face more, much shallower cut, ball slightly back. Practise on wet or compacted sand specifically \u2014 the fluffy-sand method actively fails there.`;
      } else if(fluffy > tight && fluffy){
        note = ` These were FLUFFY sand \u2014 the club drops too deep and the ball goes nowhere.`;
        drill = `Fluffy-sand technique: open the face to use the bounce, enter 2in behind, accelerate through. 20 reps.`;
      }
      f.push({
        sev: sBad.length >= 2 ? 'crit' : 'warn',
        title: `${sBad.length} of ${sandGs.length} bunker shot${sandGs.length>1?'s':''} cost you`,
        body: `Hole${sBad.length>1?'s':''} ${[...new Set(sBad.map(x=>x.hole))].join(', ')}. Sand is its own skill \u2014 the strike that works off grass does not work in a bunker.${note}`,
        fix: drill
      });
    } else if(sGraded.length){
      f.push({ sev:'good', title:`Bunker play held up (${sGraded.length} shot${sGraded.length>1?'s':''})`, body:`No strokes leaked from sand.`, fix:null });
    }
  }

  // --- TEE SHOT MISS PATTERN ---
  const teeMisses = H.filter(h => h.teeMiss);
  if(teeMisses.length){
    const tm = tally(teeMisses, h=>h.teeMiss);
    const top = topKey(tm);
    let read, drill;
    if(top[0]==='slice'){
      read = `A repeating SLICE \u2014 face open to path through impact. It also costs distance, which puts longer clubs in your hand for the approach and compounds the hole.`;
      drill = `Headcover drill: headcover just outside the ball on the target line, swing without hitting it to feel an in-to-out path. 20 balls.`;
    } else if(top[0]==='hook'){
      read = `A repeating HOOK \u2014 face closing hard relative to path, usually from an over-rotating release or a grip too strong.`;
      drill = `Split-hand drill: 10 slow swings with hands apart to feel the body leading rather than the hands flipping, then 15 normal balls.`;
    } else if(top[0]==='thin'||top[0]==='fat'){
      read = `Your tee misses are strike-related (${top[0]}) rather than curvature \u2014 that is a low-point and contact issue, not an aim or path fault.`;
      drill = `Tee-height and ball-position check: 15 balls with a strict ball-position reference, then alignment stick for low point.`;
    } else {
      read = `Tee misses are mixed, so no single swing fault repeats.`;
      drill = `Play the percentages: use your most reliable club off the tee on tight holes rather than chasing a fix mid-round.`;
    }
    f.push({
      sev: teeMisses.length >= 4 ? 'crit' : 'warn',
      title: `Tee miss pattern: ${tstr(tm)}`,
      body: `${read}`,
      fix: drill
    });
  }

  // ---------- TEE vs APPROACH BLAME SPLIT ----------
  const teeMissCostPosition = H.filter(h => (h.teeShot==='x'||h.teeShot==='o') && h.esz==='x');
  const teeOkApproachFailed = H.filter(h => h.teeShot==='check' && h.esz==='x');
  const teeMissRecovered    = H.filter(h => h.teeShot==='x' && h.esz==='check');

  lost.tee += teeMissCostPosition.length;
  lost.approach += teeOkApproachFailed.length;

  if(teeMissCostPosition.length){
    f.push({
      sev: teeMissCostPosition.length >= 3 ? 'crit' : 'warn',
      title: `${teeMissCostPosition.length} hole${teeMissCostPosition.length>1?'s':''} where a missed tee shot directly cost you the scoring zone`,
      body: `Hole${teeMissCostPosition.length>1?'s':''} ${hn(teeMissCostPosition)}. The drive missed and you never recovered position. These are tee-shot strokes, not approach strokes.`,
      fix: `Find your go-to club (Key 10 / first gear). If driver misses cost more than the yards gain, tee off with 3W or hybrid on the tightest holes.`
    });
  }
  if(teeOkApproachFailed.length){
    f.push({
      sev: teeOkApproachFailed.length >= 3 ? 'crit' : 'warn',
      title: `${teeOkApproachFailed.length} hole${teeOkApproachFailed.length>1?'s':''} where you were in the fairway and still missed the zone`,
      body: `Hole${teeOkApproachFailed.length>1?'s':''} ${hn(teeOkApproachFailed)}. Good position wasted. With no tee-shot excuse, this is iron distance control or club selection — Key 5, under-clubbing.`,
      fix: `Carry-distance ladder: hit 8 balls each with 3 mid-irons and record actual carry, not your best-ever number. Club to the average.`
    });
  }
  if(teeMissRecovered.length >= 2){
    f.push({
      sev: 'good',
      title: `${teeMissRecovered.length} good recoveries after a missed tee shot`,
      body: `Hole${teeMissRecovered.length>1?'s':''} ${hn(teeMissRecovered)}. You got back into position rather than compounding — that's Key 3 working.`,
      fix: null
    });
  }

  // ---------- PENALTIES ----------
  const penaltyHoles = H.filter(h => h.teeShot==='o' || h.esz==='o' || h.sz==='o');
  lost.penalty += penaltyHoles.length;
  if(penaltyHoles.length){
    f.push({
      sev: penaltyHoles.length >= 2 ? 'crit' : 'warn',
      title: `${penaltyHoles.length} penalty hole${penaltyHoles.length>1?'s':''}`,
      body: `Hole${penaltyHoles.length>1?'s':''} ${hn(penaltyHoles)}. Free strokes given away before any skill was tested. Key 2 — this is always the first thing to cut.`,
      fix: `On the tee, pick the side of the hole with no penalty. Aim at the widest miss, not the target line.`
    });
  }

  // ---------- DAMAGE CONTROL (the core objective) ----------
  const blowups = H.filter(h => {
    const s = num(h.score), p = num(h.par);
    return s!==null && p!==null && (s - p) >= 2;
  });
  if(blowups.length){
    const causes = blowups.map(h => {
      const c = [];
      if(h.teeShot==='o'||h.esz==='o'||h.sz==='o') c.push('penalty');
      if((num(h.puttsTotal)||0) >= 3) c.push('3-putt');
      if(greenside(h) !== null && greenside(h) >= 2) c.push('short game');
      if(h.teeShot==='x' && h.esz==='x') c.push('tee shot');
      return `H${h.n} (${c.length?c.join(' + '):'unattributed'})`;
    });
    f.push({
      sev: 'crit',
      title: `${blowups.length} hole${blowups.length>1?'s':''} at double bogey or worse`,
      body: `The whole method exists to prevent these. Causes: ${causes.join('; ')}.`,
      fix: `Look at the repeated cause above — that single phase is costing you the objective, not your swing generally.`
    });
  }

  const totalLost = Object.values(lost).reduce((a,b)=>a+b,0);
  return { findings: f, lost, totalLost, played: H.length };
}

const LOST_META = [
  { id:'lag',       name:'Lag putting',    color:'#8A6A2F' },
  { id:'shortPutt', name:'Short putts',    color:'#B4463A' },
  { id:'shortGame', name:'Short game',     color:'#C79A4B' },
  { id:'tee',       name:'Tee shots',      color:'#2F5138' },
  { id:'approach',  name:'Approach',       color:'#3C7A52' },
  { id:'penalty',   name:'Penalties',      color:'#6B6656' }
];

function renderAnalysisTable(){
  const el = document.getElementById('analysisTable');
  const g = state.gearSettings[state.currentGear] || {};
  const d = diagnose(state.holes, parseInt(g.downIn));

  if(!d.played){
    el.innerHTML = `<h3>Diagnosis</h3><div class="an-focus">Fill in a few holes and specific findings will appear here.</div>`;
    return;
  }

  // strokes-lost ledger
  const ranked = LOST_META.map(m => ({...m, val: d.lost[m.id]})).sort((a,b)=>b.val-a.val);
  const max = Math.max(1, ...ranked.map(r=>r.val));
  const ledger = ranked.map(r => `
    <div class="ledger-row">
      <div class="ledger-name">${r.name}</div>
      <div class="ledger-bar"><div class="ledger-fill" style="width:${(r.val/max*100).toFixed(0)}%;background:${r.color}"></div></div>
      <div class="ledger-val">${r.val ? '+'+r.val : '0'}</div>
    </div>
  `).join('');

  const top = ranked.filter(r=>r.val>0).slice(0,2);
  const headline = top.length
    ? `<div class="an-priority"><b>${d.totalLost} strokes</b> traced to specific causes. Biggest leak${top.length>1?'s':''}: <b>${top.map(t=>`${t.name} (+${t.val})`).join(' and ')}</b>.</div>`
    : `<div class="an-priority">No attributable leaks yet — add putts and shots-to-get-down per hole for a full diagnosis.</div>`;

  const order = { crit:0, warn:1, good:2 };
  const findings = d.findings.slice().sort((a,b)=>order[a.sev]-order[b.sev]).map(x => `
    <div class="find-row ${x.sev}">
      <div class="find-title">${x.title}</div>
      <div class="find-body">${x.body}</div>
      ${x.fix ? `<div class="find-fix"><b>Drill:</b> ${x.fix}</div>` : ''}
    </div>
  `).join('');

  el.innerHTML = `
    <h3>Diagnosis</h3>
    ${headline}
    <div class="rr-group-title">WHERE THE STROKES WENT</div>
    ${ledger}
    <div class="rr-group-title" style="margin-top:14px">WHAT THE NUMBERS IMPLY</div>
    ${findings || '<div class="an-focus">Not enough per-hole detail yet.</div>'}
  `;
}

function persist(){
  state.name = document.getElementById('name').value;
  state.course = document.getElementById('course').value;
  state.date = document.getElementById('date').value;
  state.tee = document.getElementById('tee').value;
  state.handicap = document.getElementById('handicap').value;
  save();
}

async function save(showStatus){
  try{
    localStorage.setItem('scoring-tracker:current', JSON.stringify(state));
    if(showStatus){
      upsertHistory();
      statusEl.textContent = 'Saved.';
      setTimeout(()=>statusEl.textContent='',1500);
    }
  }catch(e){
    if(showStatus){ statusEl.textContent = 'Could not save — data kept for this session only.'; }
  }
}

const HISTORY_KEY = 'scoring-tracker:history';

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch(e){ return []; }
}

function writeHistory(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
  catch(e){}
}

function upsertHistory(){
  const holes = state.holes;
  const totalScore = holes.reduce((s,h)=> s + (parseInt(h.score)||0), 0);
  const totalPar = holes.reduce((s,h)=> s + (h.score!=='' ? (parseInt(h.par)||0) : 0), 0);
  const holesWithScore = holes.filter(h=>h.score!=='').length;
  const toPar = totalPar ? (totalScore - totalPar) : null;
  const eszHit = holes.filter(h=>h.esz==='check').length;
  const eszSeen = holes.filter(h=>h.esz!=='').length;
  const szHit = holes.filter(h=>h.sz==='check').length;
  const szSeen = holes.filter(h=>h.sz!=='').length;
  const totalPutts = holes.reduce((s,h)=> s + (parseInt(h.puttsTotal)||0), 0);

  if(!holesWithScore && !state.course && !eszSeen && !szSeen) return; // nothing worth saving yet

  const entry = {
    id: state.id,
    savedAt: new Date().toISOString(),
    name: state.name, course: state.course, date: state.date, tee: state.tee,
    totalScore: holesWithScore ? totalScore : null,
    toPar,
    eszPct: eszSeen ? Math.round(100*eszHit/eszSeen) : null,
    szPct: szSeen ? Math.round(100*szHit/szSeen) : null,
    totalPutts,
    snapshot: JSON.parse(JSON.stringify(state))
  };

  let hist = loadHistory();
  const idx = hist.findIndex(r => r.id === state.id);
  if(idx >= 0) hist[idx] = entry; else hist.push(entry);
  writeHistory(hist);
  renderHistory();
}

function sortKey(entry){
  return entry.date || entry.savedAt || '';
}

function renderHistoryTrends(){
  const wrap = document.getElementById('trendsWrap');
  const hist = loadHistory().slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b))); // oldest -> newest

  if(hist.length < 2){
    wrap.innerHTML = `
      <div class="trends-section">
        <h3>Progress Over Time</h3>
        <div class="trend-empty">Save at least 2 rounds to see how each area is trending.</div>
      </div>
    `;
    return;
  }

  const series = LOST_META.map(a => ({
    ...a,
    values: hist.map(r => {
      const hs = r.snapshot ? r.snapshot.holes : null;
      if(!hs) return null;
      const dg = diagnose(hs);
      return dg.played ? dg.lost[a.id] : null;
    })
  }));

  const W = 280, H = 46, PAD = 4;

  function sparkline(values, color){
    const pts = values.map((v,i)=> ({i, v}));
    const withData = pts.filter(p => p.v !== null);
    if(withData.length < 2){
      return `<div style="font-size:11px;color:var(--ink-soft);padding:6px 0;">Not enough data yet</div>`;
    }
    const n = values.length;
    const scaleMax = Math.max(3, ...withData.map(p=>p.v));
    const xStep = (W - PAD*2) / Math.max(1, n-1);
    const coords = values.map((v,i)=> {
      const x = PAD + i*xStep;
      const y = v===null ? null : PAD + (H - PAD*2) * (1 - v/scaleMax);
      return {x, y, v};
    });
    // build path skipping nulls (gaps)
    let path = '';
    let started = false;
    coords.forEach(c => {
      if(c.y===null){ started = false; return; }
      path += (started ? 'L' : 'M') + c.x.toFixed(1) + ',' + c.y.toFixed(1) + ' ';
      started = true;
    });
    const dots = coords.filter(c=>c.y!==null).map(c =>
      `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="${color}"/>`
    ).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  }

  const rows = series.map(s => {
    const withData = s.values.filter(v=>v!==null);
    const latest = withData.length ? withData[withData.length-1] : null;
    const first = withData.length ? withData[0] : null;
    let deltaHtml = '';
    if(latest!==null && first!==null && withData.length>1){
      const d = latest - first;
      const cls = d<0 ? 'up' : d>0 ? 'down' : 'flat';
      const arrow = d<0 ? '▲ better' : d>0 ? '▼ worse' : '▬ flat';
      deltaHtml = `<span class="trend-delta ${cls}">${arrow} ${d>0?'+':''}${d}</span>`;
    }
    return `
      <div class="trend-row">
        <div class="trend-top">
          <div class="trend-name">${s.name}</div>
          <div>${latest!==null ? '+'+latest : '–'} ${deltaHtml}</div>
        </div>
        ${sparkline(s.values, s.color)}
      </div>
    `;
  }).join('');

  wrap.innerHTML = `
    <div class="trends-section">
      <h3>Progress Over Time</h3>
      <div class="trends-sub">${hist.length} rounds, oldest to newest. Strokes lost per area — lower is better.</div>
      ${rows}
    </div>
  `;
}

function renderHistory(){
  renderHistoryTrends();
  const listEl = document.getElementById('historyList');
  const hist = loadHistory().slice().sort((a,b) => sortKey(b).localeCompare(sortKey(a)));

  if(!hist.length){
    listEl.innerHTML = `<div class="history-empty">No saved rounds yet.<br>Fill in a round and tap "Save round" to start building your history.</div>`;
    return;
  }

  listEl.innerHTML = hist.map(r => {
    const dateStr = r.date ? new Date(r.date + 'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '(no date)';
    const parStr = r.toPar===null ? '' : (r.toPar>0?`+${r.toPar}`:r.toPar===0?'E':`${r.toPar}`);
    const statsBits = [];
    if(r.eszPct!==null) statsBits.push(`Zone ${r.eszPct}%`);
    if(r.szPct!==null) statsBits.push(`Down-in ${r.szPct}%`);
    if(r.totalPutts) statsBits.push(`${r.totalPutts} putts`);
    return `
      <div class="hist-card" data-id="${r.id}">
        <div class="hist-main">
          <div class="hist-course">${r.course || 'Untitled round'}</div>
          <div class="hist-date">${dateStr}${r.tee ? ' · ' + r.tee : ''}</div>
          ${statsBits.length ? `<div class="hist-stats">${statsBits.join(' · ')}</div>` : ''}
        </div>
        <div class="hist-score">
          <div class="num">${r.totalScore ?? '–'}</div>
          ${parStr ? `<div class="par">${parStr}</div>` : ''}
        </div>
        <button class="hist-del" data-id="${r.id}" title="Delete">✕</button>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.hist-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.classList.contains('hist-del')) return;
      loadFromHistory(card.dataset.id);
    });
  });
  listEl.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('Delete this round from history?')){
        const hist2 = loadHistory().filter(r => r.id !== btn.dataset.id);
        writeHistory(hist2);
        renderHistory();
      }
    });
  });
}

function loadFromHistory(id){
  const hist = loadHistory();
  const entry = hist.find(r => r.id === id);
  if(!entry) return;
  state = JSON.parse(JSON.stringify(entry.snapshot));
  if(!state.gearSettings){
    state.gearSettings = { 1:{dist:100,downIn:3}, 2:{dist:50,downIn:2}, 3:{dist:25,downIn:2}, 4:{dist:0,downIn:1} };
  }
  if(!state.currentGear){ state.currentGear = 1; }
  if(!state.id){ state.id = id; }
  state.holes = (state.holes || []).map(h => ({ shotsEnter:'', shotsDownIn:'', shortPutt:'', teeShot:'', teeMiss:'', done:false, shots:[], ...h }));
  document.getElementById('name').value = state.name || '';
  document.getElementById('course').value = state.course || '';
  document.getElementById('date').value = state.date || '';
  document.getElementById('tee').value = state.tee || '';
  document.getElementById('handicap').value = state.handicap || '';
  renderGearControls();
  renderHoles();
  renderSummary();
      renderRoundResults();
      renderAnalysisTable();
  save();
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="round"]').classList.add('active');
  document.getElementById('tab-round').classList.add('active');
}

  document.getElementById('course').value = state.course || '';

  renderHoles();

// ---- Export a human + AI readable round report ----
function buildRoundReport(){
  const g = state.gearSettings[state.currentGear] || {};
  const holes = state.holes;
  const played = holes.filter(h => h.score!=='' || h.esz!=='' || h.puttsTotal!=='');
  const num = v => { const n=parseInt(v); return isNaN(n)?null:n; };

  const scored     = holes.filter(h => num(h.score)!==null);
  const totalScore = scored.reduce((s,h)=>s+(num(h.score)||0),0);
  // only count par for holes actually scored, otherwise partial rounds show a nonsense to-par
  const totalPar   = scored.reduce((s,h)=>s+(num(h.par)||0),0);
  const fullRound  = scored.length >= 18;
  const totalPutts = holes.reduce((s,h)=>s+(num(h.puttsTotal)||0),0);
  const toPar = totalPar ? totalScore-totalPar : null;
  const hcp = num(state.handicap);

  const L = [];
  L.push('=== GOLF ROUND REPORT (The Scoring Method) ===');
  L.push('');
  L.push(`Player:          ${state.name||'-'}`);
  L.push(`Course:          ${state.course||'-'}`);
  L.push(`Date:            ${state.date||'-'}`);
  L.push(`Tee:             ${state.tee||'-'}`);
  L.push(`Course Handicap: ${state.handicap||'-'}`);
  L.push(`Gear:            ${state.currentGear} (zone ${zoneLabel(g.dist)}, down in ${g.downIn??'-'})`);
  L.push('');
  L.push(`Gross: ${totalScore||'-'}   Par (holes played): ${totalPar||'-'}   To par: ${toPar===null?'-':(toPar>0?'+'+toPar:toPar)}   Net: ${(fullRound&&hcp!==null)?totalScore-hcp:'-'}`);
  L.push(`Total putts: ${totalPutts||'-'}   Holes scored: ${scored.length}${fullRound?'':'  (PARTIAL ROUND - totals cover played holes only)'}`);
  L.push('');

  // Round Results block (official card roll-up)
  const box1 = holes.filter(h=>h.esz==='check').length;
  const box2 = holes.filter(h=>h.sz==='check').length;
  const onePutts = holes.filter(h=>num(h.puttsTotal)===1).length;
  const threePutts = holes.filter(h=>(num(h.puttsTotal)||0)>=3).length;
  L.push('--- ROUND RESULTS ---');
  L.push(`Gave myself a chance to score (ESZ):   ${box1}`);
  L.push(`Scored when in position (down in ${g.downIn??3}): ${box2}`);
  L.push(`One-putts:                             ${onePutts}`);
  L.push(`Three-putts or worse:                  ${threePutts}`);
  L.push('');

  // Per-hole detail
  L.push('--- HOLE BY HOLE ---');
  L.push('H | Par | Sc | Tee | Miss  | ESZ | Shots | D-in | Shots | Putts');
  holes.forEach(h => {
    if(h.score==='' && h.esz==='' && h.puttsTotal==='' && !(h.shots||[]).some(s=>s.type)) return;
    const mark = v => v==='check'?'Y':v==='x'?'N':v==='o'?'PEN':'-';
    L.push(
      `${String(h.n).padStart(2)} | ${(h.par||'-').padStart(3)} | ${(h.score||'-').padStart(2)} | ` +
      `${mark(h.teeShot).padEnd(3)} | ${(h.teeMiss||'-').padEnd(5)} | ${mark(h.esz).padEnd(3)} | ` +
      `${(h.shotsEnter||'-').padStart(5)} | ${mark(h.sz).padEnd(4)} | ${(h.shotsDownIn||'-').padStart(5)} | ${(h.puttsTotal||'-').padStart(5)}`
    );
    (h.shots||[]).forEach((sh,i) => {
      if(!sh.type) return;
      const bits = [`shot ${i+1}: ${sh.type}`];
      if(sh.surface||sh.texture) bits.push(`lie ${[sh.surface,sh.texture].filter(Boolean).join('/')}`);
      if(sh.conn) bits.push(`connection ${sh.conn}`);
      if(sh.out)  bits.push(`outcome ${sh.out}`);
      L.push(`      ${bits.join(', ')}`);
    });
  });
  L.push('');

  // Diagnosis
  const d = diagnose(holes, num(g.downIn));
  L.push('--- STROKES LOST LEDGER ---');
  LOST_META.forEach(m => L.push(`${m.name.padEnd(14)} +${d.lost[m.id]}`));
  L.push(`${'TOTAL'.padEnd(14)} +${d.totalLost}`);
  L.push('');
  L.push('--- APP DIAGNOSIS ---');
  d.findings.forEach(x => {
    L.push(`[${x.sev.toUpperCase()}] ${x.title}`);
    L.push(`  ${x.body}`);
    if(x.fix) L.push(`  Suggested drill: ${x.fix}`);
    L.push('');
  });

  L.push('--- REQUEST ---');
  L.push('Please review the shot-level data above and give me:');
  L.push('1. Your own analysis of where the strokes actually went, and whether you agree with the app diagnosis.');
  L.push('2. Any patterns the app missed, especially causal links between phases.');
  L.push('3. A prioritised action plan for the next 2-3 practice sessions, with specific drills and rep counts.');
  L.push('4. One or two on-course strategy changes to try in the next round.');
  L.push('');
  L.push(`RAW JSON (for exact parsing):`);
  L.push(JSON.stringify({
    meta:{name:state.name,course:state.course,date:state.date,tee:state.tee,handicap:state.handicap,
          gear:state.currentGear,gearSettings:state.gearSettings[state.currentGear]},
    holes: holes.filter(h=>h.score!==''||h.esz!==''||h.puttsTotal!==''||(h.shots||[]).some(s=>s.type))
  }));
  return L.join('\n');
}

function exportRound(){
  const txt = buildRoundReport();
  const stamp = (state.date || new Date().toISOString().slice(0,10));
  const course = (state.course||'round').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const fname = `golf-${course}-${stamp}.txt`;
  try{
    const blob = new Blob([txt], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    statusEl.textContent = 'Exported ' + fname;
  }catch(e){
    statusEl.textContent = 'Export failed on this device.';
  }
  // iOS PWA often blocks downloads: offer share sheet / clipboard as fallback
  if(navigator.share){
    try{
      navigator.share({title:'Golf round report', text:txt}).catch(()=>{});
    }catch(e){}
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>{
      statusEl.textContent = 'Report copied to clipboard.';
    }).catch(()=>{});
  }
  setTimeout(()=>statusEl.textContent='', 4000);
}
